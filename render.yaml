# Render Blueprint: one-click deploy of the gateway with managed Redis and Postgres.
# Dashboard -> New -> Blueprint -> pick this repo. Then set the secret keys below in the Render UI.
services:
  - type: web
    name: llm-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GATEWAY_API_KEYS
        generateValue: true          # Render generates a random key; copy it from the dashboard
      - key: GEMINI_API_KEY
        sync: false                  # you paste this in the Render UI (never commit it)
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RATE_LIMIT_RPM
        value: "120"
      - key: RATE_LIMIT_BURST
        value: "20"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: llm-gateway-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: llm-gateway-db
          property: connectionString

  - type: keyvalue
    name: llm-gateway-redis
    plan: free
    ipAllowList: []                  # internal access only

databases:
  - name: llm-gateway-db
    plan: free
